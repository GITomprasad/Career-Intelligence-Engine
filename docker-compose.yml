version: '3.8'

services:
  streamlit-ui:
    build: .
    container_name: career-intelligence-ui
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  fastapi-backend:
    build: .
    container_name: career-intelligence-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
